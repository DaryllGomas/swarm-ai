name = "swarm-ai"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Live only at swarm.bigpicsolutions.com (one origin).
workers_dev = false
routes = [{ pattern = "swarm.bigpicsolutions.com", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/ops*", "/api/*", "/mcp", "/setup", "/llms.txt", "/authorize", "/oauth/*", "/.well-known/*", "/version", "/transparency", "/transparency.html"]

[[d1_databases]]
binding = "DB"
database_name = "swarm-ai"
database_id = "c678de31-f2dd-4329-b484-660a06caa864"
migrations_dir = "migrations"

# UNUSED since migration 0014: MCP sign-in (OAuth) now keeps all its state in D1 (oauth_* tables). This binding is left in place only
# because the namespace already exists; no code reads or writes it. Once the OAuth release is live, the binding and the namespace are
# safe to delete (remove these three lines, then `wrangler kv namespace delete`).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "cebbf26e68f844afb4470b5f828abe60"

[vars]
RP_ID = "swarm.bigpicsolutions.com"
RP_ORIGIN = "https://swarm.bigpicsolutions.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFd2bPXEe9MhB2jx"
# Lockdown lever. "open" (default) or "paused". Paused stops new pairings, claims and submissions
# (pair, next_task, claim_task, submit_work); reads, the API and admin review keep working. It is an intake pause,
# not a write freeze: release_task, claim expiry, sync, admin review and the hourly cron still write.
# Change the value, then deploy (scripts/deploy.sh).
INTAKE = "open"
# GIT_COMMIT and BUILT_AT are not set here: scripts/deploy.sh injects them at deploy time (--var), and GET /version reports them.
# MCP sign-in (OAuth) kill switch. "on" (default) or "off". Off: /authorize answers 503, the OAuth endpoints are not served, and
# /mcp accepts only the existing contributor keys (swk_...). Public tools and bearer keys are unaffected either way.
OAUTH = "off"
# Cloudflare Access for /ops and /api/ops (app "Swarm AI operator console"). The Worker verifies Access's JWT itself.
ACCESS_TEAM_DOMAIN = "bigpicsolutions.cloudflareaccess.com"
ACCESS_AUD = "d3f079ae0a2015ff77b79f30869524ecfe7510e98193b2522954e3a8a98b0db5"
# OPS_EMAILS (comma-separated operator emails) is a Worker SECRET, so personal emails stay out of this public repo:
#   scripts/deploy.sh secret put OPS_EMAILS
# Additional exact origins for local development only (comma-separated, no wildcards).
OPS_ALLOWED_ORIGINS = ""

[ai]
binding = "AI"

# Hourly: pull tasks from Town Hall and expire stale claims.
[triggers]
crons = ["0 * * * *"]

# Burst limit per network on every write (free; counters are per Cloudflare location).
# Town Hall uses namespace 1002; Swarm uses 1003.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Secrets (wrangler secret put ...), never committed. Locally they live in .dev.vars (gitignored):
#   TURNSTILE_SECRET registration-only human check; missing secret fails closed
#   ADMIN_TOKEN  long random string; Bearer token for /api/admin/* (anything else gets a 404)
#   HASH_SALT    long random string; salts contributor-key hashes. (Network hashes use a random key per UTC day, kept in D1 and deleted after two days; they do not use it.)
#   GITHUB_TOKEN (optional) read-only fine-grained token for public repos; only raises GitHub's rate limit
#   GITHUB_WEBHOOK_SECRET (optional) enables POST /api/github/webhook; without it that path is a 404
