name = "swarm-ai"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Live only at swarm.bigpicsolutions.com (one origin).
workers_dev = false
routes = [{ pattern = "swarm.bigpicsolutions.com", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/ops*", "/api/*", "/mcp", "/setup", "/llms.txt"]

[[d1_databases]]
binding = "DB"
database_name = "swarm-ai"
database_id = "c678de31-f2dd-4329-b484-660a06caa864"
migrations_dir = "migrations"

[vars]
# Lockdown lever. "open" (default) or "paused". Paused stops new pairings, claims and submissions
# (pair, next_task, claim_task, submit_work); reads, the API and admin review keep working. It is an intake pause,
# not a write freeze: release_task, claim expiry, sync, admin review and the hourly cron still write.
# Change the value, then deploy (scripts/deploy.sh).
INTAKE = "open"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
OPS_EMAILS = ""
# Additional exact origins for local development only (comma-separated, no wildcards).
OPS_ALLOWED_ORIGINS = ""

[ai]
binding = "AI"

# Hourly: pull tasks from Town Hall and expire stale claims.
[triggers]
crons = ["7 * * * *"]

# Burst limit per network on every write (free; counters are per Cloudflare location).
# Town Hall uses namespace 1002; Swarm uses 1003.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Secrets (wrangler secret put ...), never committed. Locally they live in .dev.vars (gitignored):
#   ADMIN_TOKEN  long random string; Bearer token for /api/admin/* (anything else gets a 404)
#   HASH_SALT    long random string; salts contributor-key hashes and the daily network hash
#   GITHUB_TOKEN (optional) read-only fine-grained token for public repos; only raises GitHub's rate limit
#   GITHUB_WEBHOOK_SECRET (optional) enables POST /api/github/webhook; without it that path is a 404
